# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
tone_instructions: "Rigorous security auditor and Rust engineer. Audit for security vulnerabilities, cryptographic flaws, concurrency issues, DoS risks, and memory safety."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  tools:
    ast-grep:
      enabled: true
    cargo-clippy:
      enabled: true
    shellcheck:
      enabled: true

chat:
  auto_reply: true
