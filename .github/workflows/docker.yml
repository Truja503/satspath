name: Docker Build & Scan

on:
  push:
    branches: [main, develop, "feature/**", "feat/**"]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
  pull_request:
    branches: [main, develop, satspath-standalone]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_CLI: ${{ github.repository_owner }}/satspath-cli

jobs:
  build-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta-cli
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_CLI }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build and load CLI image (with cache)
        uses: docker/build-push-action@4f58ea79222b3b73204d3e32bc70b0de180f8ca1 # v6.9.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          load: true
          tags: satspath-cli:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan (CLI image)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.29.0
        with:
          image-ref: satspath-cli:local
          format: sarif
          output: trivy-cli.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy scan results (CLI)
        if: always()
        uses: github/codeql-action/upload-sarif@6bb034414c767602ec877db0b8202e3c8b18af36 # v3.28.11
        with:
          sarif_file: trivy-cli.sarif
          category: trivy-cli

      - name: Push CLI image (to GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@4f58ea79222b3b73204d3e32bc70b0de180f8ca1 # v6.9.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta-cli.outputs.tags }}
          labels: ${{ steps.meta-cli.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true
