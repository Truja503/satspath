name: Convert Markdown to LaTeX and PDF

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
  workflow_dispatch:

jobs:
  convert_docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Fetch full history to ensure committing works cleanly
          fetch-depth: 0

      - name: Install Pandoc and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic texlive-latex-extra texlive-fonts-extra

      - name: Convert Markdown to LaTeX and PDF
        run: |
          # Find all markdown files, ignoring common build and dependency directories
          find . -name "*.md" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/target/*" \
            -not -path "*/.git/*" \
            -not -path "*/pkg/*" \
            -not -path "*/.github/*" | while read -r md_file; do
            
            # Remove leading ./
            rel_path="${md_file#./}"
            dir_name=$(dirname "$rel_path")
            base_name=$(basename "$md_file" .md)
            
            # Create target directories
            mkdir -p "docs/latex/$dir_name"
            mkdir -p "docs/pdf/$dir_name"
            
            echo "Processing: $md_file -> docs/latex/$dir_name/${base_name}.tex and docs/pdf/$dir_name/${base_name}.pdf"
            
            # Generate LaTeX
            pandoc "$md_file" -o "docs/latex/$dir_name/${base_name}.tex" --standalone || echo "Warning: Failed to convert $md_file to .tex"
            
            # Generate PDF using XeLaTeX to better support Unicode and standard formatting
            pandoc "$md_file" -o "docs/pdf/$dir_name/${base_name}.pdf" --pdf-engine=xelatex -V geometry:margin=1in || echo "Warning: Failed to convert $md_file to .pdf"
          done

      - name: Commit and push generated files
        uses: stefanzweifel/git-auto-commit-action@8621497c800810e84ab0f44012c5240c4fb45313 # v5.0.1
        with:
          commit_message: "docs: Auto-generate LaTeX and PDF copies into docs/latex and docs/pdf"
          file_pattern: 'docs/latex/** docs/pdf/**'
