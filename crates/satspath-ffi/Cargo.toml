[package]
name = "satspath-ffi"
version = "0.1.0"
edition = "2021"
description = "UniFFI bindings for SatsPath"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["uniffi_bindings"]
uniffi_bindings = ["satspath-core/uniffi_feature", "satspath-router/uniffi_feature"]

[dependencies]
satspath-core = { path = "../satspath-core", features = ["uniffi_feature"] }
satspath-router = { path = "../satspath-router", features = ["uniffi_feature"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
secp256k1 = { workspace = true, features = ["global-context"] }
hex = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }

# UniFFI
uniffi = { workspace = true, features = ["bindgen"] }

[build-dependencies]
# No build deps needed — proc-macro UniFFI