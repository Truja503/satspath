[package]
name = "satspath-ffi"
version = "0.1.0"
edition = "2021"
description = "UniFFI bindings for SatsPath"

[lib]
crate-type = ["cdylib"]

[features]
default = ["uniffi_bindings"]
uniffi_bindings = ["satspath-core/uniffi_feature", "satspath-router/uniffi_feature"]

[dependencies]
satspath-core = { path = "../satspath-core", features = ["uniffi_feature"] }
satspath-router = { path = "../satspath-router", features = ["uniffi_feature"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
secp256k1 = { workspace = true, features = ["global-context"] }
bitcoin = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
urlencoding = "2"
uuid = { workspace = true, features = ["v4", "serde"] }
url = { workspace = true }
rand = { workspace = true, features = ["std"] }
sha2 = "0.10"
async-compat = "0.2"

# UniFFI
uniffi = { workspace = true }
uniffi_build = { workspace = true }

[build-dependencies]
uniffi_build = { workspace = true }